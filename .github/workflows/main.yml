name: 서도호 토요일 취소표 확인

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 브라우저 설치
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: 1분 간격으로 예약 확인
        shell: python
        run: |
          import os
          import json
          import re
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          URL = (
              "https://booking.naver.com/booking/12/"
              "bizes/1715706/items/7955135"
              "?startDateTime=2026-11-07T00%3A00%3A00%2B09%3A00"
          )
          KST = ZoneInfo("Asia/Seoul")
          END = datetime(2026, 11, 8, tzinfo=KST)
          MANUAL = os.environ["MANUAL"] == "true"

          def notify(message):
              token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
              chat = os.environ["TELEGRAM_CHAT_ID"].strip()
              if not token or not chat:
                  raise RuntimeError("텔레그램 Secrets를 확인하세요.")

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=json.dumps({
                      "chat_id": chat,
                      "text": message
                  }).encode(),
                  headers={"Content-Type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      raise RuntimeError()
              except Exception:
                  raise RuntimeError("텔레그램 알림 전송 실패") from None

          if datetime.now(KST) >= END:
              print("감시 기간 종료. 워크플로를 비활성화하세요.")
              raise SystemExit(0)

          previous = None
          error_notified = False

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(locale="ko-KR")

              for attempt in range(100):
                  if datetime.now(KST) >= END:
                      break

                  started = time.monotonic()
                  stamp = datetime.now(KST).strftime("%m/%d %H:%M:%S")

                  try:
                      page.goto(
                          URL,
                          wait_until="domcontentloaded",
                          timeout=45000
                      )

                      calendar = page.get_by_role("table").filter(
                          has=page.get_by_role(
                              "button",
                              name=re.compile(r"^7(?:\s|$)")
                          )
                      )
                      calendar.wait_for(state="visible", timeout=30000)

                      if "2026.11" not in page.locator("body").inner_text():
                          raise RuntimeError("11월 달력 확인 실패")

                      day = calendar.get_by_role(
                          "button",
                          name=re.compile(r"^7(?:\s|$)")
                      )
                      if day.count() != 1:
                          raise RuntimeError("7일 버튼 확인 실패")

                      # 늦게 표시되는 매진 문구를 기다립니다.
                      page.wait_for_timeout(2000)
                      label = day.inner_text().strip()

                      if re.search(r"매진|마감|sold\s*out", label, re.I):
                          status = "매진"
                      elif not day.is_enabled():
                          raise RuntimeError("7일 상태 판별 불가")
                      else:
                          status = "매진 표시 없음"

                  except Exception:
                      print(f"{stamp} 조회 실패", flush=True)
                      if not error_notified:
                          notify(
                              "⚠️ 예약 화면을 확인하지 못했습니다.\n"
                              "매진 여부를 알 수 없는 상태입니다.\n" + URL
                          )
                          error_notified = True

                  else:
                      print(f"{stamp} 11/7: {status}", flush=True)

                      if status == "매진 표시 없음" and previous != status:
                          notify(
                              "🔔 서도호 11/7 매진 표시가 사라졌습니다.\n"
                              "실제 예약 가능 여부와 회차를 확인하세요.\n"
                              + URL
                          )
                      elif MANUAL and attempt == 0:
                          notify(
                              "✅ 1분 간격 확인 시작.\n"
                              "현재 11/7은 매진입니다.\n" + URL
                          )

                      previous = status

                  if attempt < 179:
                      remaining = 60 - (time.monotonic() - started)
                      if remaining > 0:
                          time.sleep(remaining)

              browser.close()
